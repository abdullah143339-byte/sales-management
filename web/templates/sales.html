{% extends "base.html" %}
{% block header %}Add Sale{% endblock %}
{% block content %}

<div class="section-head">
  <span class="section-accent"></span>
  <h3>Add Sale</h3>
</div>

<div class="sale-layout">
  <div class="card sale-left">
    <div class="panel-title">Search / Select Product</div>
    <input type="text" id="sale-search" placeholder="Type product name or ID..." autocomplete="off">
    <div class="sale-results" id="sale-results">
      <div class="sale-hint">Start typing to search for a product.</div>
    </div>
  </div>

  <div class="card sale-right">
    <div class="panel-title">Sale Details</div>
    <form id="sale-form" method="post" action="{{ url_for('sales_page') }}" autocomplete="off">
      <input type="hidden" name="product_id" id="sale-product-id" value="">
      <div id="sale-detail" class="sale-detail">Select a product to begin.</div>

      <div class="sale-row">
        <span class="sale-field-label">Unit Price:</span>
        <span class="sale-price" id="sale-price">Rs. 0</span>
      </div>

      <div class="sale-row">
        <span class="sale-field-label">Quantity:</span>
        <input type="text" id="sale-qty" placeholder="Enter quantity sold" inputmode="numeric" style="width: 160px;">
      </div>

      <div class="sale-remaining" id="sale-remaining"></div>
      <div class="sale-warning" id="sale-warning"></div>

      <div class="sale-row total">
        <span class="sale-field-label">Total Amount:</span>
        <span class="sale-total" id="sale-total">Rs. 0</span>
      </div>

      <button type="submit" class="btn btn-success" id="sale-save" disabled>Save Sale</button>
    </form>
  </div>
</div>

{% endblock %}
